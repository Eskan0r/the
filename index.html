<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1016" />
    <meta name="description" content="Ronak Chavva, full-stack software engineer. Backend systems, AI tooling, and interfaces." />
    <title>Ronak Chavva</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <script>
      const onPondPath = () => (location.pathname === '/fish' || location.pathname === '/fish/') && !location.hostname.startsWith('os.')
      if (onPondPath()) {
        document.documentElement.classList.add('koi-loading')
      }
    </script>
    <style>
      html { background: #0d1016; }
      #koi-intro { display: none; }
      html.koi-loading, .koi-loading #koi-intro { background: #79b6a9; }
      .koi-loading #koi-intro {
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 1;
        background-image: radial-gradient(ellipse at 30% 18%, #c5e0b04d, transparent 68%),
          radial-gradient(ellipse at 85% 100%, #407d792e, transparent 68%);
      }
      .koi-intro-backdrop {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        image-rendering: pixelated; pointer-events: none;
      }
      #koi-intro > canvas {
        position: relative; z-index: 1; width: min(84vmin, 640px); height: auto; image-rendering: pixelated;
        filter: drop-shadow(5px 9px 0 #234d5430);
      }
      .koi-loading-bar {
        --lead: 0%; --trail: 0%; --corner: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 2px, 100% 2px,
          100% calc(100% - 2px), calc(100% - 3px) calc(100% - 2px), calc(100% - 3px) 100%, 3px 100%,
          3px calc(100% - 2px), 0 calc(100% - 2px), 0 2px, 3px 2px);
        position: absolute; z-index: 2; left: 50%; top: calc(50% + min(21vmin, 155px));
        transform: translateX(-50%); width: clamp(100px, 23vmin, 164px); height: 12px;
        padding: 2px; box-sizing: border-box; clip-path: var(--corner);
        background: linear-gradient(#365e58 50%, #264d49 50%); pointer-events: none;
      }
      .koi-loading-bar[data-mode^="wide"] { height: 22px; }
      .koi-loading-bar[data-mode^="vertical"] { width: 16px; height: clamp(32px, 12vmin, 76px); }
      .koi-bar-track {
        position: relative; overflow: hidden; height: 100%; clip-path: var(--corner);
        background: repeating-linear-gradient(90deg, #5e8c82 0 2px, transparent 2px 14px), #457269;
        box-shadow: inset 0 2px #355f59;
      }
      .koi-bar-track::before {
        content: ''; position: absolute; inset: 0; width: 32%; opacity: .6;
        background: linear-gradient(100deg, transparent, #c1dfad65, transparent);
        animation: koi-bar-current 2.1s ease-in-out infinite;
      }
      @keyframes koi-bar-current { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
      .koi-bar-track i {
        position: absolute; inset: 0;
        background: linear-gradient(0deg, #76b99b 0 2px, transparent 2px),
          repeating-linear-gradient(90deg, #d9eead 0 3px, transparent 3px 18px) 0 2px / 100% 2px no-repeat,
          linear-gradient(#d4eab2 0 2px, #a5d497 2px 60%, #98cfa7 60%);
        clip-path: inset(0 calc(100% - var(--lead)) 0 0);
      }
      .koi-bar-track i + i { display: none; }
      .koi-loading-bar:is([data-mode="left"], [data-mode="split-right"]) i { clip-path: inset(0 0 0 calc(100% - var(--lead))); }
      .koi-loading-bar[data-mode^="split"] i + i { display: block; }
      .koi-loading-bar[data-mode="split-left"] i + i { clip-path: inset(0 0 0 calc(100% - var(--trail))); }
      .koi-loading-bar[data-mode="split-right"] i + i { clip-path: inset(0 calc(100% - var(--trail)) 0 0); }
      .koi-loading-bar[data-mode$="-down"] i { clip-path: inset(0 0 calc(100% - var(--lead)) 0); }
      .koi-loading-bar[data-mode$="-up"] i { clip-path: inset(calc(100% - var(--lead)) 0 0 0); }
      #koi-intro[data-paused] .koi-bar-track::before { animation-play-state: paused; }
      #koi-intro[data-ready] .koi-bar-track::before { display: none; }
      @media (prefers-reduced-motion: reduce) { .koi-bar-track::before { animation: none; } }
      #load-error:not([hidden]) {
        position: fixed; inset: 0; z-index: 2; display: grid; align-content: center;
        justify-items: center; gap: 0.75rem; color: #183f3d; background: #a9cdbf;
        font: 1rem system-ui, sans-serif;
      }
      #load-error a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <template id="koi-intro-template">
      <div id="koi-intro" role="status" aria-label="Loading koi pond">
        <img class="koi-intro-backdrop" alt="" decoding="async" fetchpriority="low" hidden>
        <canvas width="96" height="44" aria-hidden="true"></canvas>
        <div class="koi-loading-bar" data-progress="0" aria-hidden="true">
          <div class="koi-bar-track"><i></i><i></i></div>
        </div>
      </div>
    </template>
    <script>
      function mountPondLoader() {
        if (!onPondPath() || document.getElementById('koi-intro')) return
        const intro = document.getElementById('koi-intro-template').content.firstElementChild.cloneNode(true)
        document.documentElement.classList.add('koi-loading')
        document.body.append(intro)
        const modes = ['right', 'left', 'split-left', 'split-right', 'wide-down', 'wide-up', 'vertical-down', 'vertical-up']
        intro.querySelector('.koi-loading-bar').dataset.mode = modes[Math.floor(Math.random() * modes.length)]
        const backdrop = intro.querySelector('img')
        backdrop.onload = () => { backdrop.hidden = false }
        backdrop.src = '/pond/intro/background.png'
        const sync = () => intro.toggleAttribute('data-paused', document.hidden)
        document.addEventListener('visibilitychange', sync)
        const leave = () => { if (!onPondPath()) intro.dispatchEvent(new Event('koi-dismiss')) }
        window.addEventListener('popstate', leave)
        const detach = () => {
          document.removeEventListener('visibilitychange', sync)
          window.removeEventListener('popstate', leave)
        }
        intro.addEventListener('koi-start', detach, { once: true })
        intro.addEventListener('koi-dismiss', () => {
          detach()
          document.documentElement.classList.remove('koi-loading')
          intro.remove()
        }, { once: true })
        sync()
      }
      document.addEventListener('koi-enter', mountPondLoader)
      if (document.documentElement.classList.contains('koi-loading')) mountPondLoader()
    </script>
    <div id="load-error" role="alert" hidden>This page couldn't load. <a href="">Reload page</a></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
