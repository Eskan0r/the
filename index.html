<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1016" />
    <meta name="description" content="Ronak Chavva, full-stack software engineer. Backend systems, AI tooling, and interfaces." />
    <title>Ronak Chavva</title>
    <script>
      if (location.pathname === '/' && !location.hostname.startsWith('os.')) {
        document.documentElement.classList.add('koi-loading')
      }
    </script>
    <style>
      html { background: #0d1016; }
      #koi-intro { display: none; }
      html.koi-loading, .koi-loading #koi-intro { background: #79b6a9; }
      .koi-loading #koi-intro {
        display: grid; place-items: center; position: fixed; inset: 0; z-index: 1;
        background-image: radial-gradient(ellipse at 30% 18%, #c5e0b04d, transparent 68%),
          radial-gradient(ellipse at 85% 100%, #407d792e, transparent 68%);
      }
      .koi-intro-backdrop {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        image-rendering: pixelated; pointer-events: none;
      }
      #koi-intro > canvas {
        position: relative; z-index: 1; width: min(84vmin, 640px); height: auto; image-rendering: pixelated;
        filter: drop-shadow(5px 9px 0 #234d5430);
      }
      .koi-loading-bubbles {
        position: absolute; z-index: 2; left: 50%; top: calc(50% + min(21vmin, 155px));
        transform: translateX(-50%); display: flex; align-items: center; gap: 9px;
      }
      .koi-loading-bubbles i {
        width: 14px; height: 14px; position: relative; background: #427e80;
        clip-path: polygon(28% 0,72% 0,72% 10%,90% 10%,90% 28%,100% 28%,100% 72%,90% 72%,90% 90%,72% 90%,72% 100%,28% 100%,28% 90%,10% 90%,10% 72%,0 72%,0 28%,10% 28%,10% 10%,28% 10%);
        animation: koi-bubble-pulse 1.45s ease-in-out infinite;
      }
      .koi-loading-bubbles i::before {
        content: ''; position: absolute; inset: 1.5px; clip-path: inherit;
        background: linear-gradient(135deg, #f2f3c9 2%, #abddd1 28%, #60a5a5 65%, #aad7bf 90%);
      }
      .koi-loading-bubbles i::after {
        content: ''; position: absolute; top: 3px; left: 3px; width: 4px; height: 2px; background: #fffde5;
      }
      .koi-loading-bubbles i:nth-child(2) { animation-delay: .16s; }
      .koi-loading-bubbles i:nth-child(3) { animation-delay: .32s; }
      @keyframes koi-bubble-pulse {
        0%, 68%, 100% { transform: translateY(0) scale(.87); opacity: .73; }
        29% { transform: translateY(-5px) scale(1.1); opacity: 1; }
      }
      #koi-intro[data-paused] .koi-loading-bubbles i { animation-play-state: paused; }
      #koi-intro[data-ready] .koi-loading-bubbles { visibility: hidden; }
      @media (prefers-reduced-motion: reduce) { .koi-loading-bubbles i { animation: none; } }
      #load-error:not([hidden]) {
        position: fixed; inset: 0; z-index: 2; display: grid; align-content: center;
        justify-items: center; gap: 0.75rem; color: #183f3d; background: #a9cdbf;
        font: 1rem system-ui, sans-serif;
      }
      #load-error a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="koi-intro" role="status" aria-label="Loading koi pond">
      <img class="koi-intro-backdrop" alt="" decoding="async" fetchpriority="low" hidden>
      <canvas width="96" height="44" aria-hidden="true"></canvas>
      <div class="koi-loading-bubbles" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <script>
      if (document.documentElement.classList.contains('koi-loading')) {
        const intro = document.getElementById('koi-intro')
        const backdrop = intro.querySelector('img')
        backdrop.onload = () => { backdrop.hidden = false }
        backdrop.src = '/pond/intro/background.png'
        const sync = () => intro.toggleAttribute('data-paused', document.hidden)
        document.addEventListener('visibilitychange', sync)
        intro.addEventListener('koi-start', () => document.removeEventListener('visibilitychange', sync), { once: true })
        sync()
      }
    </script>
    <div id="load-error" role="alert" hidden>This page couldn't load. <a href="">Reload page</a></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
